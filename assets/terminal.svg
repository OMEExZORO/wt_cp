<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" role="img" aria-label="Animated terminal showing DiagnoCare quickstart">
  <defs>
    <style>
      .t { font-family: Consolas, SFMono-Regular, Menlo, monospace; }
    </style>
  </defs>
  <rect width="760" height="320" rx="14" fill="#0e1328" stroke="#3a4266" stroke-width="2"/>
  <circle cx="34" cy="30" r="8" fill="#ff5f57"/>
  <circle cx="60" cy="30" r="8" fill="#febc2e"/>
  <circle cx="86" cy="30" r="8" fill="#28c840"/>
  <text x="116" y="36" font-family="Consolas, monospace" font-size="15" fill="#b7bccb">diagnocare — quickstart</text>
  <g font-family="Consolas, Menlo, monospace" font-size="15">
    <text x="30" y="80" fill="#7fd9d1">$ npm run setup
      <animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="0.01s" begin="0.2s" fill="freeze"/>
    </text>
    <text x="30" y="108" fill="#8fd8a5" opacity="0">✓ root + frontend + alerts installed · composer deps ready
      <animate attributeName="opacity" values="0;1" dur="0.01s" begin="1.0s" fill="freeze"/>
    </text>
    <text x="30" y="146" fill="#7fd9d1" opacity="0">$ npm run migrate &amp;&amp; npm run seed
      <animate attributeName="opacity" values="0;1" dur="0.01s" begin="1.6s" fill="freeze"/>
    </text>
    <text x="30" y="174" fill="#8fd8a5" opacity="0">✓ migrations applied · 56 scans · checklists · FAQs seeded
      <animate attributeName="opacity" values="0;1" dur="0.01s" begin="2.4s" fill="freeze"/>
    </text>
    <text x="30" y="212" fill="#7fd9d1" opacity="0">$ npm run dev
      <animate attributeName="opacity" values="0;1" dur="0.01s" begin="3.0s" fill="freeze"/>
    </text>
    <text x="30" y="240" fill="#8fd8a5" opacity="0">✓ API :8000 · app :5173 · alerts :4000
      <animate attributeName="opacity" values="0;1" dur="0.01s" begin="3.8s" fill="freeze"/>
    </text>
    <text x="30" y="278" fill="#ffb36b" opacity="0">→ open http://localhost:5173 — same-origin session cookies just work
      <animate attributeName="opacity" values="0;1" dur="0.01s" begin="4.4s" fill="freeze"/>
    </text>
  </g>
</svg>
