name: keepalive-and-jobs

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: keepalive-and-jobs
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping API
        run: curl -fsS --retry 9 --retry-delay 10 --retry-all-errors --max-time 30 https://diagnocare-api.onrender.com/api/v1/health
      - name: Ping through frontend
        run: curl -fsS --retry 3 --retry-delay 5 --retry-all-errors --max-time 30 https://meghnaddiagnostics.me/api/v1/health

  alert-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: services/alerts/package-lock.json
      - run: npm ci
        working-directory: services/alerts
      - run: npm run jobs:once
        working-directory: services/alerts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ALERT_ESCALATION_MINUTES: ${{ secrets.ALERT_ESCALATION_MINUTES || '30' }}
          MAIL_DRIVER: ${{ secrets.MAIL_DRIVER || 'log' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL || 'https://meghnaddiagnostics.me' }}
